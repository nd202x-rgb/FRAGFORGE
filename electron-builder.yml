appId: com.fragforge.app
productName: FragForge
copyright: ND202
directories:
  output: release
files:
  - electron/main.js
  - electron/preload.js
  - electron/launcher.html
  - package.json
afterPack: electron/afterpack.cjs
extraResources:
  - from: dist-app
    to: app
  - from: electron/config.json
    to: config.json
win:
  target: nsis
  icon: public/logo-mark.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: FragForge
  createDesktopShortcut: true
  createStartMenuShortcut: true
